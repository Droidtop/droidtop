apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.android.app.animation"
    testNamespace = "com.android.app.animation.tests"

    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
        androidTest {
            java.srcDirs = ["tests/src", "tests/robolectric/src"]
            manifest.srcFile 'tests/AndroidManifest.xml'
        }
    }

    lintOptions {
        abortOnError false
    }
    tasks.lint.enabled = false
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs = ["-Xjvm-default=all"]
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk7
    implementation libs.androidx.core.animation
    implementation libs.androidx.core.ktx
    androidTestImplementation libs.robolectric
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.rules
}

// Added by droidtop's fork (not upstream Murine) — see shell-default/
// build.gradle's own header comment for why this can't be injected
// centrally from there.
def _frameworkStubs = project.configurations.detachedConfiguration(
        project.dependencies.create("com.github.alesimula:android-framework-stubs:16-r2")
)
_frameworkStubs.transitive = false
dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.annotation
    implementation libs.kotlinx.coroutines
}
// A plain compileOnly dependency does NOT win against the SDK's own
// (redacted) android.jar for android.* symbols — that comes from AGP's
// bootclasspath, a separate, higher-priority classpath segment. Prepending
// the stub jar onto each compile task's own classpath/libraries is what
// actually makes hidden android.* symbols resolve.
tasks.withType(JavaCompile).configureEach { task ->
    task.doFirst {
        task.classpath = files(_frameworkStubs.resolve()) + task.classpath
    }
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    task.doFirst {
        task.libraries.from(files(_frameworkStubs.resolve()))
    }
}
