plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "androidx.dynamicanimation.animation"

    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    sourceSets {
        main {
            java.srcDirs = ['src']
        }
    }
}

dependencies {
    implementation libs.core
    implementation libs.annotation
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.rules
}

//addFrameworkJar('framework-15.jar')
//compileOnlyCommonJars()

// Added by droidtop's fork (not upstream Murine) — see shell-default/
// build.gradle's own header comment for why this can't be injected
// centrally from there.
def _frameworkStubs = project.configurations.detachedConfiguration(
        project.dependencies.create("com.github.alesimula:android-framework-stubs:16-r2")
)
_frameworkStubs.transitive = false
dependencies {
    compileOnly project.files(_frameworkStubs.resolve())
    implementation libs.androidx.core.ktx
    implementation libs.annotation
    implementation libs.kotlinx.coroutines
}
