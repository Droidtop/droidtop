name: Publish primary image

# Builds images/primary/Dockerfile (droidtop's own PRIMARY-role container
# image -- sway on a real init, see that Dockerfile's own comments) and
# pushes it to GHCR. crane (CraneRootfsPuller/CraneImageCatalogResolver,
# runtime-linux-root) pulls it with no credentials at all, so the pushed
# package must be set to Public in this repo's GitHub Packages settings --
# GITHUB_TOKEN can push but can't flip package visibility, so that's a
# real one-time manual step after the first successful run, not something
# this workflow can do for you.
on:
  push:
    branches: [main]
    paths:
      - "images/primary/**"
      - ".github/workflows/publish-primary-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/droidtop-primary

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        # linux/arm64 on an x86_64 (ubuntu-24.04) runner needs emulation --
        # droidtop only ever targets arm64 devices (docs/SPEC.md), so this
        # is the only platform built; no native arm64 runner available here.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/primary
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:bookworm-sway
