name: Android checks

# Lint (the minSdk API gate) and the unit tests, split out of android-build.yml
# so the APK run finishes when the APK is published. This run reports on the
# same push and its red is as red as before; it just no longer stands between
# a push and an installable build. Same triggers and path filters as the build,
# and the same setup (.github/actions/android-setup), so a build run's SDK and
# vendor-deps cache entries serve this one too.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "AGENTS.md"
  workflow_dispatch:

# Nothing here publishes or pushes; Gradle and the vendor builds get a
# read-only token (Droidtop/enginehost docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Vendored upstream sources (DroidSpaces, sway,
          # wlroots, moonlight-common-c, mbedtls, libffi, ...) are large;
          # we only ever need their current tip, not history.
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the Android build
        uses: ./.github/actions/android-setup

      # These run in their own workflow so that a failing check turns THIS
      # run red and never costs anyone the installable build: this
      # project's real workflow is installing the CI artifact on a rig, and
      # blocking that on lint or a unit test would trade something real for
      # a convention. The signal is what matters here, not the gate.
      # :runtime-common joins the run because the ES-DE theme engine lives
      # there, and its carousel/textlist geometry is a literal port of real
      # ES-DE formulas -- exactly the kind of code a unit test can verify
      # without a screen, which is otherwise the only way this project
      # checks theme rendering at all.
      # The UI rules (docs/SPEC.md 7k, "Notices"): each rule is switched on in
      # scripts/check-ui-rules.sh in the commit that clears its last site, so
      # this fails only on a site a switched-on rule forbids; the fixture test
      # proves every rule, on or off, catches what it names.
      - name: UI rules
        if: ${{ !cancelled() }}
        run: |
          scripts/test-check-ui-rules.sh
          scripts/check-ui-rules.sh --check

      - name: Lint (minSdk API gate)
        # NewApi/InlinedApi only, across :app and everything it depends on
        # -- see the lint block in app/build.gradle.kts for why this
        # exists. !cancelled() rather than always(): a red step earlier in
        # the job should not hide this one's answer, but a run cancelled by
        # the next push has no answer to give, and running the gate there
        # only reports a failure nobody caused.
        #
        # Scope: our own modules are strict -- a NewApi error in anything
        # droidtop writes, shell-default/src (the launcher fork's own
        # sources) included, fails this step. The exceptions are the trees
        # droidtop vendors rather than writes -- the Winlator runtime
        # :runtime-windows carries unchanged (com.winlator) and
        # shell-default's vendored AOSP sub-libraries (:WMShared, :msdl,
        # :Shared) -- whose findings are recorded in app/lint-baseline.xml;
        # see the lint block in app/build.gradle.kts and SPEC 10b for why
        # a baseline rather than an exclusion, and note that the baseline
        # still fails any finding it does not already list.
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug --stacktrace

      - name: One Compose version across modules
        # A module compiled against another Compose than the app ships dies at runtime with NoSuchMethodError
        # (Droidtop/tracker#566: the plugin page's FlowRow). The root build's checkComposeVersions compares every
        # module's compile classpath with the app's release runtime.
        if: ${{ !cancelled() }}
        run: ./gradlew checkComposeVersions --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The baseline itself goes up too: when it does not exist lint
          # WRITES it and aborts, and that generated file is how the
          # committed one is produced (filtered to the vendored tree)
          # rather than hand-written against a format lint owns.
          path: |
            app/build/reports/lint-results-debug.*
            app/lint-baseline.xml
          name: lint-report
          if-no-files-found: ignore

      - name: Every module with tests is run below
        # Droidtop/tracker#730: :net-core, the one download engine, had ten test files and was not in the list
        # below, so a regression in it would have shipped green. A module with a src/test tree that the
        # next step does not run fails here, naming it.
        if: always()
        run: |
          missing=""
          for dir in */src/test; do
            module="${dir%%/*}"
            grep -q ":${module}:testDebugUnitTest" .github/workflows/android-checks.yml || missing="$missing $module"
          done
          if [ -n "$missing" ]; then
            echo "Modules with src/test that 'Run unit tests' does not run:$missing" >&2
            exit 1
          fi

      - name: Run unit tests
        # Every module that actually has a src/test tree (app, library-core, runtime-common, shell-gamepad,
        # input-seat, runtime-windows, input-keyboard, host-bridge, display, net-core and the rest), not just
        # library-core — that narrower scope meant roughly 30% of this repo's test methods had never once run in
        # CI. Add the module here the moment it grows its first test; the step above fails when one is missing.
        if: always()
        run: ./gradlew :app:testDebugUnitTest :library-core:testDebugUnitTest :runtime-common:testDebugUnitTest :shell-gamepad:testDebugUnitTest :input-seat:testDebugUnitTest :input-mapping:testDebugUnitTest :runtime-windows:testDebugUnitTest :input-keyboard:testDebugUnitTest :host-bridge:testDebugUnitTest :runtime-linux-noroot:testDebugUnitTest :plugin-host:testDebugUnitTest :plugin-host-testing:testDebugUnitTest :stores:testDebugUnitTest :display:testDebugUnitTest :ui-shared:testDebugUnitTest :net-core:testDebugUnitTest :shell-desktop:testDebugUnitTest --stacktrace

      - name: Plugin conformance (python fixture)
        # docs/plugin-api.md 3 I2 (Droidtop/tracker#71): the python kind's fixture through the same
        # conformance cases the native fixture passes in :plugin-host-testing's ConformanceTest.
        if: always()
        run: python3 -I plugin-host-testing/python/droidtop_fake_host.py plugin-host-testing/src/test/fixtures/python

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            library-core/build/reports/tests/
            runtime-common/build/reports/tests/
            shell-gamepad/build/reports/tests/
            input-seat/build/reports/tests/
            input-mapping/build/reports/tests/
            runtime-windows/build/reports/tests/
            input-keyboard/build/reports/tests/
            host-bridge/build/reports/tests/
            plugin-host/build/reports/tests/
            plugin-host-testing/build/reports/tests/
            display/build/reports/tests/
            ui-shared/build/reports/tests/
          if-no-files-found: ignore
