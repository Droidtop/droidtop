name: x86_64 Venus driver

# Builds Mesa's Venus Vulkan driver (libvulkan_virtio.so) for droidtop's x86_64 Wine guest from Termux's Mesa recipe
# and patches, with droidtop's socket patch (build-scripts/x86_64-venus/mesa-venus), and keeps the package as a run
# artifact (slice 1 of Droidtop/tracker#608, a real GPU on x86_64), and the vtest server that replays Venus on Android's
# own Vulkan, from Termux's virglrenderer-android recipe (build-scripts/x86_64-venus/vtest-server; slice 2). Nothing
# ships yet: packing both and the driver choice in X86_64Graphics are slice 3.

on:
  push:
    paths:
      - 'build-scripts/x86_64-venus/**'
      - '.github/workflows/x86_64-venus.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same termux-packages commit the xlib OpenGL build starts from (x86_64-lavapipe.yml), so both Mesa builds
  # share Termux's patches and dependencies.
  TERMUX_PACKAGES_COMMIT: 2e8fa6379b106caa4829407611410025a0973e02
  # termux-packages at the commit whose virglrenderer-android (1.3.0, Venus, 0011-use-Android-Vulkan) the server is
  # built from (read 2026-11-05).
  TERMUX_PACKAGES_COMMIT_VTEST: 789d4606fe4950215443f0f43e80cabafdb3254e

jobs:
  mesa-venus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: termux-packages
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          git remote add origin https://github.com/termux/termux-packages
          git fetch -q --depth 1 origin "$TERMUX_PACKAGES_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Recipe
        run: bash build-scripts/x86_64-venus/mesa-venus/prepare.sh "$RUNNER_TEMP/termux-packages"

      - name: Build
        # Termux's own package builder image, as termux-packages' CI runs it; -I takes every dependency from
        # Termux's x86_64 repository.
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          ./scripts/run-docker.sh ./build-package.sh -I -a x86_64 mesa-venus
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp output/mesa-venus_*_x86_64.deb "$GITHUB_WORKSPACE/out/"

      - name: Check
        # The driver, its ICD manifest, and the socket read from the environment (droidtop's 0005).
        run: |
          deb=$(ls out/mesa-venus_*_x86_64.deb)
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          lib=$(find "$RUNNER_TEMP/deb" -name libvulkan_virtio.so | head -1)
          json=$(find "$RUNNER_TEMP/deb" -name 'virtio_icd.x86_64.json' | head -1)
          test -n "$lib" && test -n "$json"
          cat "$json"
          readelf -d "$lib" | grep NEEDED
          strings "$lib" | grep -x VTEST_SOCKET_NAME

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-mesa-venus
          path: out/*.deb
          retention-days: 30

  vtest-server:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: termux-packages
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          git remote add origin https://github.com/termux/termux-packages
          git fetch -q --depth 1 origin "$TERMUX_PACKAGES_COMMIT_VTEST"
          git checkout -q FETCH_HEAD

      - name: Recipe
        run: bash build-scripts/x86_64-venus/vtest-server/prepare.sh "$RUNNER_TEMP/termux-packages"

      - name: Build
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          ./scripts/run-docker.sh ./build-package.sh -I -a x86_64 virgl-vtest-droidtop
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp output/virgl-vtest-droidtop_*_x86_64.deb "$GITHUB_WORKSPACE/out/"

      - name: Check
        # One executable, linked only against Android's own libraries (virglrenderer and libepoxy are inside it), that
        # takes its socket on the command line.
        run: |
          deb=$(ls out/virgl-vtest-droidtop_*_x86_64.deb)
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          bin=$(find "$RUNNER_TEMP/deb" -name libvirgl_vtest.so | head -1)
          test -n "$bin"
          file "$bin"
          readelf -d "$bin" | grep NEEDED | tee "$RUNNER_TEMP/needed"
          ! grep -E 'libvirglrenderer|libepoxy' "$RUNNER_TEMP/needed"
          strings "$bin" | grep -m1 -- 'socket-path'

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-virgl-vtest
          path: out/*.deb
          retention-days: 30
