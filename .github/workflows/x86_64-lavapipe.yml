name: x86_64 graphics

# Packs build-scripts/x86_64-lavapipe into x86_64-lavapipe.tzst (software Vulkan
# and, since Droidtop/tracker#309, software OpenGL) and publishes it as a
# release asset. The app downloads it on x86_64 devices when a container's
# graphics driver is lavapipe (runtime-windows/.../utils/X86_64Graphics.kt pins the
# tag and the SHA-256), the same way the x86_64 guest libraries are a download.
#
# Since Droidtop/tracker#608 it also packs Mesa's Venus ICD (build-scripts/x86_64-venus/mesa-venus), and the release
# carries libvirgl_vtest.so, the vtest server that replays Venus on Android's own Vulkan
# (build-scripts/x86_64-venus/vtest-server), which the APK ships in nativeLibraryDir: an executable cannot run from a
# downloaded archive.
#
# Moved from GameNative (by way of droidtop's former fork of it) with the
# Windows runtime (docs/SPEC.md 9). A run on main publishes a prerelease of
# this repository (prerelease so the app's update check, which reads this
# repository's releases, never mistakes it for a build); the pin in the code
# moves to a new one after a rig check.

on:
  push:
    branches: [main]
    paths:
      - 'build-scripts/x86_64-lavapipe/**'
      - 'build-scripts/x86_64-venus/**'
      - '.github/workflows/x86_64-lavapipe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The guest libraries this driver is loaded beside; libraries they already
  # provide are left out of the archive (see build.sh).
  GUEST_LIBS_TAG: x86_64-guest-libs-20261008-8a05a54d
  GUEST_LIBS_REPO: Droidtop/droidtop
  # termux-packages at the commit whose package builder and x86_64 packages the
  # Mesa builds use; their Mesa patches are commits on Droidtop/mesa since
  # Droidtop/tracker#921 (vendor/mesa-lavapipe, vendor/mesa-venus).
  TERMUX_PACKAGES_COMMIT: 2e8fa6379b106caa4829407611410025a0973e02
  # termux-packages at the commit whose virglrenderer-android (1.3.0, Venus, 0011-use-Android-Vulkan) the vtest
  # server is built from (read 2026-11-05).
  TERMUX_PACKAGES_COMMIT_VTEST: 789d4606fe4950215443f0f43e80cabafdb3254e

jobs:
  mesa-gl:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: termux-packages
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          git remote add origin https://github.com/termux/termux-packages
          git fetch -q --depth 1 origin "$TERMUX_PACKAGES_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Source
        # vendor/mesa-lavapipe is left out of every other checkout (update = none in .gitmodules): Mesa is large.
        run: git -c submodule.vendor/mesa-lavapipe.update=checkout submodule update --init --depth 1 vendor/mesa-lavapipe

      - name: Recipe
        # droidtop's recipe, Termux's cmake-wrapper.in beside it as Termux's own mesa recipe has it, and the source
        # tree without its .git (Droidtop/tracker#921: the patches are commits there, nothing is patched here).
        run: |
          tp="$RUNNER_TEMP/termux-packages"
          mkdir -p "$tp/packages/mesa-xlib-gl" "$tp/droidtop-src"
          cp build-scripts/x86_64-lavapipe/mesa-gl/build.sh "$tp/packages/mesa-xlib-gl/"
          cp "$tp/packages/mesa/cmake-wrapper.in" "$tp/packages/mesa-xlib-gl/"
          git -C vendor/mesa-lavapipe archive --prefix=mesa-lavapipe/ HEAD | tar -x -C "$tp/droidtop-src"

      - name: Build
        # Termux's own package builder image, as termux-packages' CI runs it;
        # -I takes every dependency from Termux's x86_64 repository.
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          ./scripts/run-docker.sh ./build-package.sh -I -a x86_64 mesa-xlib-gl
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp output/mesa-xlib-gl_*_x86_64.deb "$GITHUB_WORKSPACE/out/"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-mesa-gl
          path: out/*.deb
          retention-days: 30

  mesa-venus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: termux-packages
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          git remote add origin https://github.com/termux/termux-packages
          git fetch -q --depth 1 origin "$TERMUX_PACKAGES_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Source
        # vendor/mesa-venus is left out of every other checkout (update = none in .gitmodules): Mesa is large.
        run: git -c submodule.vendor/mesa-venus.update=checkout submodule update --init --depth 1 vendor/mesa-venus

      - name: Recipe
        # droidtop's recipe and the source tree without its .git (Droidtop/tracker#921).
        run: |
          tp="$RUNNER_TEMP/termux-packages"
          mkdir -p "$tp/packages/mesa-venus" "$tp/droidtop-src"
          cp build-scripts/x86_64-venus/mesa-venus/build.sh "$tp/packages/mesa-venus/"
          git -C vendor/mesa-venus archive --prefix=mesa-venus/ HEAD | tar -x -C "$tp/droidtop-src"

      - name: Build
        # Termux's own package builder image, as termux-packages' CI runs it; -I takes every dependency from
        # Termux's x86_64 repository.
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          ./scripts/run-docker.sh ./build-package.sh -I -a x86_64 mesa-venus
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp output/mesa-venus_*_x86_64.deb "$GITHUB_WORKSPACE/out/"

      - name: Check
        # The driver, its ICD manifest, and the socket read from the environment (droidtop's 0005).
        run: |
          deb=$(ls out/mesa-venus_*_x86_64.deb)
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          lib=$(find "$RUNNER_TEMP/deb" -name libvulkan_virtio.so | head -1)
          json=$(find "$RUNNER_TEMP/deb" -name 'virtio_icd.x86_64.json' | head -1)
          test -n "$lib" && test -n "$json"
          cat "$json"
          readelf -d "$lib" | grep NEEDED
          strings "$lib" | grep -x VTEST_SOCKET_NAME

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-mesa-venus
          path: out/*.deb
          retention-days: 30

  vtest-server:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: termux-packages
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          git remote add origin https://github.com/termux/termux-packages
          git fetch -q --depth 1 origin "$TERMUX_PACKAGES_COMMIT_VTEST"
          git checkout -q FETCH_HEAD

      - name: Recipe
        run: bash build-scripts/x86_64-venus/vtest-server/prepare.sh "$RUNNER_TEMP/termux-packages"

      - name: Build
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          ./scripts/run-docker.sh ./build-package.sh -I -a x86_64 virgl-vtest-droidtop
          ls -la output
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp output/virgl-vtest-droidtop_*_x86_64.deb "$GITHUB_WORKSPACE/out/"

      - name: Check
        # One executable, linked only against Android's own libraries (virglrenderer and libepoxy are inside it), that
        # takes its socket on the command line.
        run: |
          deb=$(ls out/virgl-vtest-droidtop_*_x86_64.deb)
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          bin=$(find "$RUNNER_TEMP/deb" -name libvirgl_vtest.so | head -1)
          test -n "$bin"
          file "$bin"
          readelf -d "$bin" | grep NEEDED | tee "$RUNNER_TEMP/needed"
          ! grep -E 'libvirglrenderer|libepoxy' "$RUNNER_TEMP/needed"
          strings "$bin" | grep -m1 -- 'socket-path'

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-virgl-vtest
          path: out/*.deb
          retention-days: 30

  build:
    needs: [mesa-gl, mesa-venus]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl file python3 xz-utils zstd

      - name: Guest libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GUEST_LIBS_TAG" -R "$GUEST_LIBS_REPO" -p x86_64-guest-libs.tzst -D "$RUNNER_TEMP"

      - name: OpenGL package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-mesa-gl
          path: ${{ runner.temp }}/mesa-gl

      - name: Venus package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-mesa-venus
          path: ${{ runner.temp }}/mesa-venus

      - name: Build
        env:
          GUEST_LIBS: ${{ runner.temp }}/x86_64-guest-libs.tzst
          WORK: ${{ runner.temp }}/lavapipe
        run: |
          MESA_GL_DEB=$(ls "$RUNNER_TEMP"/mesa-gl/mesa-xlib-gl_*_x86_64.deb)
          MESA_VENUS_DEB=$(ls "$RUNNER_TEMP"/mesa-venus/mesa-venus_*_x86_64.deb)
          export MESA_GL_DEB MESA_VENUS_DEB
          bash build-scripts/x86_64-lavapipe/build.sh "$GITHUB_WORKSPACE/out/x86_64-lavapipe.tzst"
          cd out && sha256sum x86_64-lavapipe.tzst | tee x86_64-lavapipe.tzst.sha256

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-lavapipe
          path: out/*
          retention-days: 30

  release:
    needs: [build, vtest-server]
    # A hand-started run on another branch builds and checks everything but publishes nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The only job that can write releases; it runs no build code.
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-lavapipe
          path: out

      - name: Download the vtest server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: x86_64-virgl-vtest
          path: vtest

      - name: The vtest server, as the APK ships it
        run: |
          deb=$(ls vtest/virgl-vtest-droidtop_*_x86_64.deb)
          mkdir -p vtest/x && dpkg-deb -x "$deb" vtest/x
          cp "$(find vtest/x -name libvirgl_vtest.so | head -1)" out/libvirgl_vtest.so
          cd out && sha256sum libvirgl_vtest.so | tee libvirgl_vtest.so.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="x86_64-lavapipe-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          pre=--prerelease
          gh release create "$tag" out/x86_64-lavapipe.tzst out/x86_64-lavapipe.tzst.sha256 \
            out/libvirgl_vtest.so out/libvirgl_vtest.so.sha256 \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $pre \
            --title "x86_64 graphics ($tag)" \
            --notes "Khronos Vulkan loader and Mesa lavapipe from Termux's x86_64 packages, and Mesa's xlib OpenGL (llvmpipe) built from Termux's recipe and patches, and Mesa's Venus ICD from Termux's recipe (build-scripts/x86_64-venus/mesa-venus), for the x86_64 Wine guest; libvirgl_vtest.so is the vtest server the APK ships (Termux's virglrenderer-android with Venus, build-scripts/x86_64-venus/vtest-server). Built from build-scripts/x86_64-lavapipe, packed from $BRANCH at $GITHUB_SHA; usr/share/doc/x86_64-lavapipe/PACKAGES lists every package and version). SHA-256: $(cut -d' ' -f1 out/x86_64-lavapipe.tzst.sha256)"
