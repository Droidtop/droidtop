name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "27.0.12077973"
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  # GitHub's ubuntu-24.04 runner image preinstalls its own SDK and sets
  # ANDROID_HOME to it (/usr/local/lib/android/sdk). AGP refuses to
  # configure at all if ANDROID_HOME and ANDROID_SDK_ROOT disagree
  # ("Several environment variables and/or system properties contain
  # different paths to the SDK") — confirmed from the actual failing CI
  # log, not a hypothetical. Pointing ANDROID_HOME at the same path we
  # install our own pinned SDK/NDK to (rather than trying to reuse the
  # runner's preinstalled one, which isn't guaranteed to have NDK
  # 27.0.12077973) resolves the conflict by making both variables agree.
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  # Not /opt/android-deps (this repo's local-dev default, see
  # build-scripts/build-vendor-deps.sh) — that needs root on a fresh
  # runner. $HOME needs no sudo and is just as reproducible.
  ANDROID_DEPS_PREFIX: ${{ github.workspace }}/.android-deps

# gh release create/delete needs write access to repo contents — the
# default GITHUB_TOKEN is read-only unless granted this explicitly.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Vendored upstream sources (GameNative, DroidSpaces, sway,
          # wlroots, moonlight-common-c, mbedtls, libffi, ...) are large;
          # we only ever need their current tip, not history.
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Three prior runs hung with ZERO visible output before being
          # cancelled -- including one AFTER adding the apt-daily-timer
          # stop + DPkg::Lock::Timeout fix, which didn't help either. The
          # real problem so far has been that `-qq` suppresses literally
          # all diagnostic output, so every "fix" up to now has been a
          # guess with no evidence to confirm or rule it out. Fixing that
          # first: `set -x` echoes each command as it starts (pinpoints
          # exactly which one is stuck), dropped `-qq` so apt's own
          # progress streams instead of being swallowed, and `timeout`
          # wraps each command so a hang fails loudly with a clear signal
          # after a bounded wait instead of running indefinitely and
          # needing manual cancellation to even notice.
          set -x
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          timeout 120 sudo apt-get update -o DPkg::Lock::Timeout=300
          timeout 300 sudo apt-get install -y -o DPkg::Lock::Timeout=300 \
            build-essential cmake ninja-build meson pkg-config git python3 \
            autoconf automake libtool libltdl-dev texinfo \
            libexpat1-dev libffi-dev libxml2-utils \
            wayland-protocols libwayland-bin \
            unzip curl

      - name: Cache Android SDK/NDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-ndk${{ env.NDK_VERSION }}-v1

      - name: Install Android SDK + NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm /tmp/cmdline-tools.zip

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Cache cross-compiled vendor deps (libffi, libwayland-client, droidspaces)
        id: deps-cache
        uses: actions/cache@v4
        with:
          # Caches the final packaged output (assets/bin) *and* the
          # ANDROID_DEPS_PREFIX build dir. assets/bin alone isn't enough: on
          # a cache hit the "Build cross-compiled vendor deps" step is
          # skipped entirely, but host-bridge's own CMake build (via
          # ANDROID_DEPS_PREFIX) still needs wayland-client.h/
          # wayland-util.h/libffi.a from that prefix at compile time, every
          # run, cache hit or not. Run 32405390718 hit exactly this: cache
          # hit skipped the deps step, .android-deps was never populated,
          # and host-bridge's ninja build failed with "'wayland-util.h' file
          # not found". Covers both ABIs since they all live under these
          # same parent directories.
          #
          # host-bridge/src/main/jniLibs is NOT cached (or populated by the
          # build step) — libwayland-client.so is packaged via CMake's own
          # prebuilt-shared-lib linking instead (see host-bridge/native/
          # CMakeLists.txt and build-scripts/build-vendor-deps.sh); a
          # separate copy into jniLibs duplicated that same APK path and
          # broke :host-bridge:mergeDebugNativeLibs.
          path: |
            runtime-linux-root/src/main/assets/bin
            ${{ env.ANDROID_DEPS_PREFIX }}
          # Keyed on every vendored submodule this script actually builds
          # from, not just a static string — a submodule bump on any of
          # them should invalidate this.
          key: android-deps-${{ hashFiles('.git/modules/vendor/libffi/HEAD', '.git/modules/vendor/wayland/HEAD', '.git/modules/vendor/droidspaces/HEAD') }}-v5

      - name: Build cross-compiled vendor deps (libffi, libwayland-client, droidspaces)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        # Invoked via `bash` explicitly, not `./build-scripts/build-vendor-deps.sh`
        # — this repo is developed partly on Windows, where the executable
        # bit doesn't reliably survive a commit, and relying on it here
        # failed CI outright ("Permission denied") the first time.
        #
        # One fat APK covers both arm64-v8a (real hardware) and x86_64
        # (emulators/x86 devices) — the script builds one ABI per
        # invocation, so run it once per target here.
        #
        # GH_TOKEN is required because the script now pulls the musl
        # cross-compiler toolchains from our own mirrored "build-toolchains"
        # release via `gh release download` instead of musl.cc directly —
        # musl.cc proved unreachable from GitHub-hosted runners often enough
        # (curl exit 28, timed out after 6 retries over 12+ minutes on run
        # 32400505729) that self-hosting the tarballs was the only reliable
        # fix. The repo is private, so authentication is required even for
        # read-only release downloads.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for abi in arm64-v8a x86_64; do
            bash build-scripts/build-vendor-deps.sh "$abi"
          done

      - name: Decode signing keystore
        # Only decodes when the secret actually exists — PR builds from
        # forks don't get repo secrets, and this step no-op'ing rather than
        # failing lets those still build (just with Android's default
        # ephemeral debug signing) instead of blocking on a secret they
        # can't have. The check has to live inside the script, not in a
        # step-level `if:` — GitHub Actions rejects `secrets` references
        # inside `if:` conditionals outright (a workflow-file parse error,
        # confirmed from run 32409339266 failing instantly with "This run
        # likely failed because of a workflow file issue" — zero jobs ever
        # started). See app/build.gradle.kts for why a persistent keystore
        # matters: without one, every CI run signs with a brand-new random
        # debug key (fresh runner VM, no persisted debug.keystore), so
        # every past "latest" release had a different signing identity and
        # users had to fully uninstall before installing a newer build.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/droidtop-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/droidtop-release.jks" >> "$GITHUB_ENV"
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret available (e.g. a fork PR) — building with Android's default debug signing instead."
          fi

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          # github.run_number: a plain incrementing integer (per workflow
          # file, monotonic across runs) — exactly the "-(revision)" tag
          # requested, not a git SHA. Read by app/build.gradle.kts.
          VERSION_REVISION: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droidtop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling "latest" release
        # Workflow artifacts (the step above) are ephemeral — ~90-day
        # retention, buried under the Actions tab, awkward to hand someone
        # a direct link to. A GitHub Release is the actual "give this to
        # someone to install" mechanism: permanent, listed on the repo's
        # main page, one clean download URL. Only publish from real pushes
        # to main, not PRs — a PR's build isn't something to hand out yet.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk droidtop-debug-latest.apk

          # Rolling release, not one-per-commit: this project is under
          # active development with no version numbers yet, so "latest"
          # always pointing at the newest working build is more useful
          # than accumulating dozens of stale per-commit releases. Delete
          # + recreate rather than `gh release upload --clobber` onto an
          # existing release, so the notes/timestamp stay accurate too.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest droidtop-debug-latest.apk \
            --title "DroidTop — latest debug build" \
            --notes "Automatically built from commit ${{ github.sha }}. Debug build (signed with a persistent DroidTop dev key — see .signing/ / SIGNING_KEYSTORE_BASE64, so it installs over a previous \"latest\" without uninstalling first; arm64-v8a + x86_64 fat APK) — not for production use, and functionality is still early: see docs/SPEC.md for current status." \
            --prerelease
