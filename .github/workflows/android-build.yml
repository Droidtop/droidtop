name: Android build

# This workflow is the APK and nothing else. Lint and the unit tests run in
# android-checks.yml on the same push, as their own run, so that the build
# that gets installed on a rig is ready in one Gradle pass instead of three:
# the checks cost roughly as long as the build again, and the people waiting
# on this run are waiting for the APK.

on:
  push:
    branches: [main]
    # A commit that only edits prose does not need a 25-minute Android
    # build. Deliberately NOT a blanket "**.md": the decaffe ES-DE theme
    # ships .md files as APK assets under shell-gamepad/src/main/assets,
    # and those are real build inputs. Only these four paths are inert.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "AGENTS.md"
      - "CHANGELOG.md"
  pull_request:
    # A commit that only edits prose does not need a 25-minute Android
    # build. Deliberately NOT a blanket "**.md": the decaffe ES-DE theme
    # ships .md files as APK assets under shell-gamepad/src/main/assets,
    # and those are real build inputs. Only these four paths are inert.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "AGENTS.md"
      - "CHANGELOG.md"
  # By hand it rebuilds this commit and publishes its per-build history
  # release again (build-scripts/release_channel.py publish-build replaces
  # a release for the exact same tag rather than failing). Testing and
  # Stable are published by release-promote.yml from an existing run's
  # artifact.
  workflow_dispatch:

# Read-only by default. Only the publish job, which runs no build code, gets
# a token that can write releases: Gradle, its plugins and the vendor-deps
# build run in the build job and must not be able to publish the release the
# in-app updater installs (Droidtop/enginehost
# docs/security/2026-09-24-ci-supply-chain.md, H3).
permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and pull requests never cancel each other.
#
# Main is the exception: a main build that has started is not cancelled. On
# 2026-10-16 a run of quick landings cancelled every main build from
# 83dd9acc to 939f7a3d (runs 38919863339, 38921783085, 38921955211), so the
# rig had no release for the build it was asked to test. A main run now
# finishes and publishes its own permanent release (docs/SPEC.md 10b). A
# newer main push waits as the group's one pending run, and GitHub replaces
# a pending run with a newer one. So a burst of landings costs at most the
# build in progress plus one more, and the newest main always builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Vendored upstream sources (DroidSpaces, sway,
          # wlroots, moonlight-common-c, mbedtls, libffi, ...) are large;
          # we only ever need their current tip, not history.
          fetch-depth: 1
          # Gradle and the vendor builds run in this job; they have no
          # business with a git credential left in .git/config.
          persist-credentials: false

      - name: XML comment dash check
        # "-" sequences (and em/en dashes one edit away from them) inside
        # XML comments break ManifestMerger2; this has failed CI multiple
        # times, so it fails fast here instead (see the script's doc).
        run: python3 build-scripts/check_xml_comments.py

      - name: Set up the Android build
        uses: ./.github/actions/android-setup

      - name: Version code
        # The number of commits reachable from this commit; see
        # build-scripts/release_channel.py for why it and not run_number.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(python3 build-scripts/release_channel.py version-code "$GITHUB_SHA")
          echo "versionCode $code"
          echo "VERSION_REVISION=$code" >> "$GITHUB_ENV"

      - name: Changelog
        # This build's changelog.json (docs/SPEC.md 10b, "Every build carries its changelog"): the history from the
        # previous release plus the changelog.d fragments new in this build. The APK bundles it (app/build.gradle.kts)
        # for What's new; the publish job makes it the release notes and refuses a build whose entry is empty.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-scripts/release_channel.py changelog app/build/generated/changelog/changelog.json "$VERSION_REVISION"

      - name: Decode signing keystore
        # Only decodes when the secret actually exists — PR builds from
        # forks don't get repo secrets, and this step no-op'ing rather than
        # failing lets those still build (just with Android's default
        # ephemeral debug signing) instead of blocking on a secret they
        # can't have. The check has to live inside the script, not in a
        # step-level `if:` — GitHub Actions rejects `secrets` references
        # inside `if:` conditionals outright (a workflow-file parse error,
        # confirmed from run 32409339266 failing instantly with "This run
        # likely failed because of a workflow file issue" — zero jobs ever
        # started). See app/build.gradle.kts for why a persistent keystore
        # matters: without one, every CI run signs with a brand-new random
        # debug key (fresh runner VM, no persisted debug.keystore), so every
        # past build's release would have had a different signing identity
        # and users had to fully uninstall before installing a newer build.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/droidtop-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/droidtop-release.jks" >> "$GITHUB_ENV"
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret available (e.g. a fork PR) — building with Android's default debug signing instead."
          fi

      - name: Report the runner's cores and memory
        # What gradle.properties budgets the daemon heaps against
        # (Droidtop/tracker#283): the log carries the real numbers.
        run: |
          nproc
          free -m

      - name: Build release and debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # droidtop's TheGamesDB application key: a build without the secret leaves it blank.
          THEGAMESDB_APP_KEY: ${{ secrets.THEGAMESDB_APP_KEY }}
        # Both variants every time, so a channel always carries the pair
        # the in-app "Install debug builds" switch chooses between. The
        # debug APK exists to be inspectable (run-as, a debugger), never to
        # play on: it is not compiled ahead of time and Android runs it
        # without inlining, which is what made droidtop slow before 558.
        # The on-device check APK (app/src/androidTest) comes from the same run, so it matches these APKs; it is never
        # published, only uploaded below for a rig to run with am instrument.
        run: ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Write release-info.json
        # Beside the APKs, in the same artifact, so that release-promote.yml
        # can later publish exactly this run's bytes to Testing or Stable.
        # The changelog goes beside it, for the publish job's notes and the next build's history.
        run: |
          python3 build-scripts/release_channel.py info app/build/outputs "$VERSION_REVISION" "$GITHUB_SHA"
          cp app/build/generated/changelog/changelog.json app/build/outputs/changelog.json

      - name: Upload APK
        # The universal APKs are what the channel publishes. The x86_64-only
        # pair is for x86 devices whose package manager installs the
        # universal APK as arm64-v8a under ARM translation (the BlueStacks
        # rig; see app/build.gradle.kts `splits`): it is uploaded here, not
        # published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-apk
          path: |
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/release-info.json
            app/build/outputs/changelog.json
          if-no-files-found: error

      - name: Upload on-device check APK
        # The rig checks run by hand with am instrument against an installed droidtop signed with the same key (the
        # priv.packages check, Droidtop/tracker#130). Not part of droidtop-apk, so no channel ever carries it.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-android-test
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Find droidtoppy native build outputs
        # AGP's exact intermediates layout for externalNativeBuild/cmake
        # output has moved between AGP versions and isn't worth guessing
        # at from the source tree alone -- list every libdroidtoppy.so
        # CMake produced so the next step's glob can be corrected against
        # this run's own log if it ever comes up empty again.
        run: find plugin-host -iname 'libdroidtoppy.so' -o -iname 'libdroidtoppy.so.debug' 2>/dev/null || true

      - name: Upload droidtoppy native symbols
        # :plugin-host/native's own libdroidtoppy.so (docs/SPEC.md 12a's
        # python bridge) -- CMake's own build tree keeps an unstripped
        # copy before AGP strips the one packaged into the APK, under
        # either intermediates layout AGP has used. A rig SIGSEGV in this
        # bridge (tombstone_14, fault addr 0x10) could only be read as a
        # bare, unsymbolised pc offset; kept as its own artifact per run
        # so a future tombstone's pc can be resolved with ndk-stack/
        # addr2line against the exact commit that built it, instead of
        # guessing from the source alone.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtoppy-native-symbols
          path: |
            plugin-host/.cxx/**/obj/**/libdroidtoppy.so
            plugin-host/build/intermediates/cxx/**/obj/**/libdroidtoppy.so
            plugin-host/build/intermediates/merged_native_libs/**/libdroidtoppy.so
          if-no-files-found: warn

      - name: Class-load API gate (minSdk)
        # The bug lint cannot see: a framework type newer than minSdk in a
        # class's own shape -- superclass, implemented interface, method
        # signature -- is resolved when that class is LOADED, so no
        # Build.VERSION check can guard it and the class simply cannot
        # exist on an older device. That is what stopped droidtop starting
        # as HOME on Android 9 (build 497, NoClassDefFoundError
        # android.window.OnBackAnimationCallback at
        # AppComponentFactory.instantiateActivity). The check reads the
        # built dex, so nothing gets past it by being generated or
        # desugared; it runs after the APK is uploaded, so a red gate never
        # costs anyone the installable build. Lint and the unit tests are
        # in android-checks.yml.
        if: ${{ !cancelled() }}
        run: python3 build-scripts/check_class_load_api.py app/build/outputs/apk/release/app-universal-release.apk

      - name: ABI sets (arm64-v8a libraries without an x86_64 build)
        # The fat APK installs as x86_64 on an Android-x86 device with ARM
        # translation only when its x86_64 set holds every arm64 name
        # (docs/SPEC.md 10b). A report, not a gate, while the per-ABI
        # splits still cover that case; it gets --require-complete when
        # they go.
        if: ${{ !cancelled() }}
        run: python3 build-scripts/abi_sets.py app/build/outputs/apk/release/app-universal-release.apk

  publish:
    # A GitHub Release is the "give this to someone to install"
    # mechanism: permanent, one clean download URL, and what the in-app
    # updater reads. Workflow artifacts are ephemeral and buried. Only
    # real pushes to main (or a hand-started run on main) publish; a
    # PR's build is not something to hand out yet. Every build gets its own
    # release, tagged by version and never rewritten (docs/SPEC.md 10b) --
    # this is what the updater calls Unstable, found through the GitHub API
    # rather than a fixed tag. Testing and Stable stay moving-pointer
    # releases, published by release-promote.yml, which takes an earlier
    # run's artifact rather than building main again.
    #
    # Its own job so the write token never shares a runner with Gradle: it
    # downloads the droidtop-apk artifact the build job made (whose layout
    # is app/build/outputs's, the same one release-promote.yml publishes
    # from) and runs only release_channel.py from this commit's checkout.
    # needs: build keeps the old gating: the build job's class-load gate
    # failing still stops the publish.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (release script only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the build's APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidtop-apk
          path: outputs

      - name: Publish this build's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-scripts/release_channel.py publish-build outputs
