name: Android build

# This workflow is the APK and nothing else. Lint and the unit tests run in
# android-checks.yml on the same push, as their own run, so that the build
# that gets installed on a rig is ready in one Gradle pass instead of three:
# the checks cost roughly as long as the build again, and the people waiting
# on this run are waiting for the APK.

on:
  push:
    branches: [main]
    # A commit that only edits prose does not need a 25-minute Android
    # build. Deliberately NOT a blanket "**.md": the decaffe ES-DE theme
    # ships .md files as APK assets under shell-gamepad/src/main/assets,
    # and those are real build inputs. Only these four paths are inert.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "CLAUDE.md"
      - ".claude/**"
  pull_request:
    # A commit that only edits prose does not need a 25-minute Android
    # build. Deliberately NOT a blanket "**.md": the decaffe ES-DE theme
    # ships .md files as APK assets under shell-gamepad/src/main/assets,
    # and those are real build inputs. Only these four paths are inert.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "NOTICE.md"
      - "LICENSE"
      - "CLAUDE.md"
      - ".claude/**"
  # By hand it rebuilds and republishes "latest". Testing and Stable are
  # published by release-promote.yml from an existing run's artifact.
  workflow_dispatch:

# Read-only by default. Only the publish job, which runs no build code, gets
# a token that can write releases: Gradle, its plugins and the vendor-deps
# build run in the build job and must not be able to rewrite "latest", which
# the in-app updater installs (Droidtop/enginehost
# docs/security/2026-09-24-ci-supply-chain.md, H3).
permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and pull requests never cancel each other.
#
# This applies to main as well, where roughly two thirds of this repo's
# runs happen. A cancellation during the publish step cannot leave "latest"
# missing: build-scripts/release_channel.py swaps assets inside the existing
# release instead of deleting it, and the only thing that can cancel a main
# run is a newer main run, which republishes when it finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Vendored upstream sources (GameNative, DroidSpaces, sway,
          # wlroots, moonlight-common-c, mbedtls, libffi, ...) are large;
          # we only ever need their current tip, not history.
          fetch-depth: 1
          # Gradle and the vendor builds run in this job; they have no
          # business with a git credential left in .git/config.
          persist-credentials: false

      - name: XML comment dash check
        # "-" sequences (and em/en dashes one edit away from them) inside
        # XML comments break ManifestMerger2; this has failed CI multiple
        # times, so it fails fast here instead (see the script's doc).
        run: python3 build-scripts/check_xml_comments.py

      - name: Set up the Android build
        uses: ./.github/actions/android-setup

      - name: Version code
        # The number of commits reachable from this commit; see
        # build-scripts/release_channel.py for why it and not run_number.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(python3 build-scripts/release_channel.py version-code "$GITHUB_SHA")
          echo "versionCode $code"
          echo "VERSION_REVISION=$code" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        # Only decodes when the secret actually exists — PR builds from
        # forks don't get repo secrets, and this step no-op'ing rather than
        # failing lets those still build (just with Android's default
        # ephemeral debug signing) instead of blocking on a secret they
        # can't have. The check has to live inside the script, not in a
        # step-level `if:` — GitHub Actions rejects `secrets` references
        # inside `if:` conditionals outright (a workflow-file parse error,
        # confirmed from run 32409339266 failing instantly with "This run
        # likely failed because of a workflow file issue" — zero jobs ever
        # started). See app/build.gradle.kts for why a persistent keystore
        # matters: without one, every CI run signs with a brand-new random
        # debug key (fresh runner VM, no persisted debug.keystore), so
        # every past "latest" release had a different signing identity and
        # users had to fully uninstall before installing a newer build.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/droidtop-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/droidtop-release.jks" >> "$GITHUB_ENV"
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret available (e.g. a fork PR) — building with Android's default debug signing instead."
          fi

      - name: Build release and debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Both variants every time, so a channel always carries the pair
        # the in-app "Install debug builds" switch chooses between. The
        # debug APK exists to be inspectable (run-as, a debugger), never to
        # play on: it is not compiled ahead of time and Android runs it
        # without inlining, which is what made droidtop slow before 558.
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Write release-info.json
        # Beside the APKs, in the same artifact, so that release-promote.yml
        # can later publish exactly this run's bytes to Testing or Stable.
        run: python3 build-scripts/release_channel.py info app/build/outputs "$VERSION_REVISION" "$GITHUB_SHA"

      - name: Upload APK
        # The universal APKs are what the channel publishes. The x86_64-only
        # pair is for x86 devices whose package manager installs the
        # universal APK as arm64-v8a under ARM translation (the BlueStacks
        # rig; see app/build.gradle.kts `splits`): it is uploaded here, not
        # published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-apk
          path: |
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/release-info.json
          if-no-files-found: error

      - name: Class-load API gate (minSdk)
        # The bug lint cannot see: a framework type newer than minSdk in a
        # class's own shape -- superclass, implemented interface, method
        # signature -- is resolved when that class is LOADED, so no
        # Build.VERSION check can guard it and the class simply cannot
        # exist on an older device. That is what stopped droidtop starting
        # as HOME on Android 9 (build 497, NoClassDefFoundError
        # android.window.OnBackAnimationCallback at
        # AppComponentFactory.instantiateActivity). The check reads the
        # built dex, so nothing gets past it by being generated or
        # desugared; it runs after the APK is uploaded, so a red gate never
        # costs anyone the installable build. Lint and the unit tests are
        # in android-checks.yml.
        if: ${{ !cancelled() }}
        run: python3 build-scripts/check_class_load_api.py app/build/outputs/apk/release/app-universal-release.apk

      - name: ABI sets (arm64-v8a libraries without an x86_64 build)
        # The fat APK installs as x86_64 on an Android-x86 device with ARM
        # translation only when its x86_64 set holds every arm64 name
        # (docs/SPEC.md 10b). A report, not a gate, while the per-ABI
        # splits still cover that case; it gets --require-complete when
        # they go.
        if: ${{ !cancelled() }}
        run: python3 build-scripts/abi_sets.py app/build/outputs/apk/release/app-universal-release.apk

  sample-plugin:
    # Builds samples/plugin-sample-statustile's payload (docs/SPEC.md 12a)
    # so dq-plugins-01 (device/QUEUE.md) is no longer blocked on "nobody
    # has run build.sh". This is a real Gradle build against :plugin-host's
    # own compiled API, dexed the same way build.sh documents (kotlinc +
    # d8), producing build/manifest.json + build/classes.jar and uploading
    # them UNSIGNED: this job never sees the plugin origin's private key
    # (droidtop-dev only, /root/coordination/keys/droidtop-plugins/), so
    # signing (sample-plugin's sign.sh) happens outside CI, same as a real
    # third-party plugin author's own release process would.
    #
    # No native code in this sample (manifest's "abis": [] -- see
    # PluginManifest.kt), so there is only one dex output; a future
    # native_bundle sample with real .so payloads would need this job to
    # build/verify a lib/<abi> pair per PluginBundleInstaller's ABI rule
    # rather than skip it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the Android build
        uses: ./.github/actions/android-setup

      - name: Build :plugin-host
        run: ./gradlew :plugin-host:assembleDebug --stacktrace

      - name: Extract the :plugin-host classpath
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-host-classes"
          unzip -q -o plugin-host/build/outputs/aar/plugin-host-debug.aar classes.jar -d "$RUNNER_TEMP/plugin-host-classes"
          echo "PLUGIN_HOST_CLASSPATH=$RUNNER_TEMP/plugin-host-classes/classes.jar" >> "$GITHUB_ENV"

      - name: Install kotlinc
        # The Kotlin compiler CLI is not on this runner image; a real
        # plugin author building outside droidtop's Gradle graph (the
        # whole point of samples/ being unlisted in settings.gradle.kts)
        # would install one too. Pinned to gradle/libs.versions.toml's
        # "kotlin" entry so this sample compiles against the same
        # language version :plugin-host itself does.
        run: |
          KOTLIN_VERSION=$(grep '^kotlin = ' gradle/libs.versions.toml | cut -d '"' -f2)
          echo "Using kotlinc $KOTLIN_VERSION"
          curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$RUNNER_TEMP/kotlinc.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Build the sample plugin payload (unsigned)
        env:
          ANDROID_JAR: ${{ env.ANDROID_SDK_ROOT }}/platforms/android-36/android.jar
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/36.0.0:$PATH"
          cd samples/plugin-sample-statustile
          ./build.sh

      - name: Upload unsigned plugin payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-sample-statustile-unsigned
          path: |
            samples/plugin-sample-statustile/build/classes.jar
            samples/plugin-sample-statustile/build/manifest.json
          if-no-files-found: error

  publish:
    # A GitHub Release is the "give this to someone to install"
    # mechanism: permanent, one clean download URL, and what the in-app
    # updater reads. Workflow artifacts are ephemeral and buried. Only
    # real pushes to main (or a hand-started run on main) publish; a
    # PR's build is not something to hand out yet. This is the "latest"
    # channel, which the updater calls Unstable. Testing and Stable are
    # published by release-promote.yml, which takes an earlier run's
    # artifact rather than building main again.
    #
    # Its own job so the write token never shares a runner with Gradle: it
    # downloads the droidtop-apk artifact the build job made (whose layout
    # is app/build/outputs's, the same one release-promote.yml publishes
    # from) and runs only release_channel.py from this commit's checkout.
    # needs: build keeps the old gating: the build job's class-load gate
    # failing still stops the publish.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (release script only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the build's APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidtop-apk
          path: outputs

      - name: Publish to the latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-scripts/release_channel.py publish latest outputs
