name: Steamworks shim

# Packs build-scripts/steamworks-shim into steamworks-shim.tzst and publishes it as
# a release asset: gbe_fork's steamclient and loader, unmodified, which a Windows
# Steam game's own steam_api finds in droidtop's Wine prefix (docs/SPEC.md 5b,
# "Steamworks in the prefix"). The app downloads it the first time a Steam game
# that uses Steamworks starts (runtime-windows/.../utils/SteamworksShim.kt pins
# the tag and the SHA-256). A run on main publishes a prerelease of this
# repository (prerelease so the app's update check, which reads this
# repository's releases, never mistakes it for a build); the pin in the code
# moves to a new one after a rig check.

on:
  push:
    branches: [main, ci/win-games-3-shim]
    paths:
      - 'build-scripts/steamworks-shim/**'
      - '.github/workflows/steamworks-shim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl p7zip-full zstd

      - name: Build
        env:
          WORK: ${{ runner.temp }}/steamworks-shim
        run: |
          bash build-scripts/steamworks-shim/build.sh "$GITHUB_WORKSPACE/out/steamworks-shim.tzst"
          cd out && sha256sum steamworks-shim.tzst | tee steamworks-shim.tzst.sha256

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steamworks-shim
          path: out/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    # The only job that can write releases; it runs no build code.
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: steamworks-shim
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="steamworks-shim-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          gh release create "$tag" out/steamworks-shim.tzst out/steamworks-shim.tzst.sha256 \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Steamworks shim ($tag)" \
            --notes "gbe_fork's steamclient and ColdClientLoader (github.com/Detanup01/gbe_fork, LGPL-3.0), unmodified, for Windows Steam games in droidtop's Wine prefix (build-scripts/steamworks-shim, packed from $BRANCH at $GITHUB_SHA; usr/share/doc/steamworks-shim/SOURCE names the upstream release and its SHA-256, LICENSE is upstream's). SHA-256: $(cut -d' ' -f1 out/steamworks-shim.tzst.sha256)"
