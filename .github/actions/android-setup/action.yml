name: Android build setup
description: >-
  Everything android-build.yml and android-checks.yml need before their first
  Gradle call: JDKs, Go, the apt toolchain, the pinned SDK/NDK, the
  cross-compiled vendor deps and the Gradle cache. One definition, so the two
  workflows cannot drift apart. Needs a checkout with submodules first.

runs:
  using: composite
  steps:
    - name: Export the SDK/NDK/deps paths
      shell: bash
      # GitHub's ubuntu-24.04 runner image preinstalls its own SDK and sets
      # ANDROID_HOME to it (/usr/local/lib/android/sdk). AGP refuses to
      # configure at all if ANDROID_HOME and ANDROID_SDK_ROOT disagree
      # ("Several environment variables and/or system properties contain
      # different paths to the SDK"), confirmed from a real failing CI log.
      # Pointing both at the pinned SDK installed below resolves it.
      # ANDROID_DEPS_PREFIX is not /opt/android-deps (this repo's local-dev
      # default, see build-scripts/build-vendor-deps.sh): that needs root on a
      # fresh runner, and the workspace is just as reproducible.
      run: |
        {
          echo "NDK_VERSION=27.0.12077973"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.android-sdk"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.android-sdk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/.android-sdk/ndk/27.0.12077973"
          echo "ANDROID_DEPS_PREFIX=$GITHUB_WORKSPACE/.android-deps"
        } >> "$GITHUB_ENV"

    - name: Set up JDK 17 + 21
      # 21 is needed for shell-default's forked-in sub-modules (Murine
      # Launcher/Launcher3): several request a Gradle toolchain matching JDK
      # 21, confirmed by a real ToolchainProvisioningException ("Cannot find a
      # Java installation... matching: {languageVersion=21, ...}"). Installing
      # both lets Gradle's toolchain auto-detection satisfy whichever each
      # module asks for; the rest of droidtop stays on 17.
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: |
          17
          21

    - name: Validate Gradle wrappers
      # Every gradle-wrapper.jar in the checkout, as setup-gradle's own
      # validation did, with one exception: vendor/SDL2/android-project's
      # (SDL's sample Android project) is not on Gradle's list of release
      # checksums. droidtop takes only SDL's headers and never runs that
      # wrapper, so exactly its checksum is allowed (run 36045468564 failed
      # on it). setup-gradle has no input for allowed checksums; this
      # action, from the same pinned release, does.
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        min-wrapper-count: 1
        allow-checksums: 2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5

    - name: Set up Gradle (dependency, wrapper and build cache)
      # Caches the Gradle user home between runs: the wrapper distribution,
      # every downloaded dependency, and the local build cache that
      # gradle.properties turns on (org.gradle.caching), so a push that
      # touches one module reuses the other modules' task outputs instead of
      # recompiling all of them. Entries are written only by runs on main
      # (the action's default) and read by every run, pull requests included;
      # entries unused by a successful run are pruned so the cache does not
      # grow without bound against the repository's cache quota.
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-cleanup: on-success
        # Validated by the step below instead, which can allow one checksum.
        validate-wrappers: false

    - name: Set up Go
      # For cross-compiling crane (vendor/go-containerregistry), the OCI
      # registry client CraneRootfsPuller shells out to; see
      # build-scripts/build-vendor-deps.sh's crane section.
      # go-containerregistry's go.mod requires >= 1.25; not assuming the
      # runner's own preinstalled Go meets that.
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: "1.25"
        cache: false

    - name: Install build dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        # Three earlier runs hung with zero visible output. `set -x` shows
        # which command is stuck, apt runs without -qq so its progress
        # streams, and `timeout` makes a hang fail loudly after a bounded
        # wait instead of needing a manual cancel to be noticed.
        set -x
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
        # The runner's Azure apt mirror sometimes serves a single package at a
        # few KB/s (runs 39857810117, 39852414045, 39848809325 stalled five
        # minutes on the 11 MB cmake .deb until the step timeout fired). Each
        # attempt therefore has its own short timeout and a low network
        # timeout, and retries; cmake is not fetched through apt at all (the
        # next step installs a pinned, checksummed release).
        apt_try() {
          for attempt in 1 2 3 4; do
            if timeout 150 sudo "$@" -o DPkg::Lock::Timeout=300                  -o Acquire::http::Timeout=20 -o Acquire::Retries=3; then
              return 0
            fi
            echo "apt attempt $attempt failed, retrying"
            sleep 5
          done
          return 1
        }
        apt_try apt-get update
        apt_try apt-get install -y           build-essential ninja-build meson pkg-config git python3           autoconf automake libtool libltdl-dev texinfo           libexpat1-dev libffi-dev libxml2-utils           wayland-protocols libwayland-bin glslang-tools           autopoint gettext patchelf zstd           unzip curl

    - name: Cache CMake
      id: cmake-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ github.workspace }}/.cmake
        key: cmake-3.31.6-linux-x86_64

    - name: Install CMake
      # A pinned upstream release instead of the apt package (see the apt
      # step above); verified by sha256 and put first on PATH.
      if: steps.cmake-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        v=3.31.6
        t="cmake-$v-linux-x86_64.tar.gz"
        curl -fsSL --retry 4 --retry-all-errors --max-time 120           "https://github.com/Kitware/CMake/releases/download/v$v/$t" -o "/tmp/$t"
        echo "5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf  /tmp/$t" | sha256sum -c -
        mkdir -p "$GITHUB_WORKSPACE/.cmake"
        tar -xzf "/tmp/$t" -C "$GITHUB_WORKSPACE/.cmake" --strip-components=1
        rm "/tmp/$t"

    - name: Put CMake on PATH
      shell: bash
      run: |
        echo "$GITHUB_WORKSPACE/.cmake/bin" >> "$GITHUB_PATH"
        "$GITHUB_WORKSPACE/.cmake/bin/cmake" --version

    - name: Cache Android SDK/NDK
      id: sdk-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ github.workspace }}/.android-sdk
        # v2: added platforms;android-36 + build-tools;36.0.0. shell-default
        # (the forked-in Murine Launcher) and its sub-modules compile against
        # 36, and several of their AndroidX deps require :app to compile
        # against 35+ too (AAR-metadata check). 34 is kept for the rest of
        # droidtop's modules. The NDK version is part of the key.
        key: android-sdk-ndk27.0.12077973-v2

    - name: Install Android SDK + NDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        rm /tmp/cmdline-tools.zip

        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        # sdkmanager --licenses stops reading stdin as soon as it has
        # seen every license it needs and exits -- on a COLD cache (no
        # SDK installed yet, so every license prompt fires) that can
        # still happen before `yes` is done writing, and the closed
        # pipe kills `yes` with SIGPIPE. With `pipefail` (this action's
        # own shell, `bash -e -o pipefail`) that failed exit status was
        # the whole line's, not sdkmanager's own -- confirmed from a
        # real cold-cache run ("yes: standard output: Broken pipe",
        # "Process completed with exit code 1", nothing else wrong).
        # `|| true` on `yes` alone (not the whole pipeline) keeps that
        # one expected-on-a-cold-cache signal from failing the step
        # while still failing on a real sdkmanager error.
        (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
        "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
          "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
          "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

    - name: Cache cross-compiled vendor deps (libffi, libwayland-client, droidspaces, crane, proot, hev-socks5-tunnel, PulseAudio)
      id: deps-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        # The packaged outputs AND the ANDROID_DEPS_PREFIX build dir: on a
        # cache hit the build step below is skipped, but host-bridge's own
        # CMake build still needs wayland-client.h/wayland-util.h/libffi.a
        # from that prefix every run (run 32405390718 failed with
        # "'wayland-util.h' file not found" when only assets/bin was cached).
        # Both ABIs live under these same directories.
        #
        # host-bridge/src/main/jniLibs is NOT cached (or populated):
        # libwayland-client.so is packaged via CMake's prebuilt-shared-lib
        # linking (host-bridge/native/CMakeLists.txt); a second copy in
        # jniLibs duplicated that APK path and broke
        # :host-bridge:mergeDebugNativeLibs.
        path: |
          runtime-linux-root/src/main/assets/bin
          runtime-common/src/main/jniLibs
          runtime-linux-noroot/src/main/jniLibs
          app/src/main/jniLibs
          runtime-windows/src/main/jniLibs
          runtime-windows/src/main/assets/pulseaudio-gamenative-x86_64.tzst
          runtime-linux-noroot/src/main/assets/pulseaudio-desktop-arm64-v8a.tzst
          ${{ github.workspace }}/.android-deps
        # Keyed on every vendored submodule the script builds from, so a
        # submodule bump invalidates it. The suffix is bumped when what the
        # script produces changes without a submodule moving:
        # v6 added crane; v7 built crane CGO_ENABLED=1 on arm64 (the pure-Go
        # DNS resolver was dead on-device); v8 moved crane to
        # runtime-common/src/main/jniLibs as libcrane.so (an extracted asset
        # cannot be exec'd above targetSdk 28) and built vendor/proot into
        # runtime-linux-noroot/src/main/jniLibs; v9 put
        # build-scripts/proot-patches into the key; v10 added
        # hev-socks5-tunnel into app/src/main/jniLibs; v11 added PulseAudio 13.0,
        # libsndfile and libltdl for x86_64 (runtime-windows/src/main); v12
        # rebuilt it because the cached x86_64 modules asset predated
        # module-pipe-source (Droidtop/tracker#80): the script had gained the
        # module but the key had not moved, so releases kept the old asset;
        # v13 added the arm64 module-pipe-source asset for the Desktop
        # microphone (Droidtop/tracker#132).
        key: android-deps-${{ hashFiles('.git/modules/vendor/libffi/HEAD', '.git/modules/vendor/wayland/HEAD', '.git/modules/vendor/droidspaces/HEAD', '.git/modules/vendor/go-containerregistry/HEAD', '.git/modules/vendor/proot/HEAD', '.git/modules/vendor/hev-socks5-tunnel/HEAD', '.git/modules/vendor/pulseaudio/HEAD', '.git/modules/vendor/libsndfile/HEAD', 'build-scripts/proot-patches/**', 'build-scripts/pulseaudio-patches/**', 'build-scripts/talloc/**') }}-v13

    - name: Build cross-compiled vendor deps (libffi, libwayland-client, droidspaces, crane, proot, hev-socks5-tunnel, PulseAudio)
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      # Run with `bash` explicitly: this repo is developed partly on Windows,
      # where the executable bit does not reliably survive a commit, and
      # relying on it failed CI with "Permission denied". One fat APK covers
      # arm64-v8a and x86_64; the script builds one ABI per invocation.
      #
      # GH_TOKEN: the script pulls the musl cross toolchains from this
      # repository's mirrored "build-toolchains" release with
      # `gh release download` (musl.cc was unreachable from hosted runners
      # often enough, run 32400505729), and the repository is private.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for abi in arm64-v8a x86_64; do
          bash build-scripts/build-vendor-deps.sh "$abi"
        done

    - name: Cache the Windows runtime's prebuilts
      id: winprebuilt-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: runtime-windows/prebuilt
        key: windows-runtime-prebuilt-${{ hashFiles('runtime-windows/prebuilt.pin') }}

    - name: Fetch the Windows runtime's prebuilts
      # GameNative's arm64 native libraries and asset payloads, re-hosted
      # unmodified as a release of this repository
      # (.github/workflows/windows-runtime-prebuilt.yml, docs/SPEC.md 9),
      # checked against runtime-windows/prebuilt.pin.
      if: steps.winprebuilt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-windows-runtime-prebuilt.sh

    - name: Cache the lsfg-vk layer
      id: lsfg-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: runtime-windows/lsfg
        key: lsfg-layer-${{ hashFiles('runtime-windows/lsfg-layer.pin') }}

    - name: Fetch the lsfg-vk layer
      # liblsfg-vk-layer.so for both ABIs, built by
      # .github/workflows/lsfg-vk-layer.yml, checked against
      # runtime-windows/lsfg-layer.pin.
      if: steps.lsfg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-lsfg-layer.sh

    - name: Cache droidtop-agent's Android library
      id: agentlib-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: net-core/agent
        key: agent-lib-${{ hashFiles('net-core/agent-lib.pin') }}

    - name: Fetch droidtop-agent's Android library
      # libdroidtop_agent.so for both ABIs, built and released by
      # Droidtop/droidtop-agent, checked against net-core/agent-lib.pin
      # (docs/SPEC.md 7o).
      if: steps.agentlib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-agent-lib.sh

    - name: Cache the bundled SQLite
      id: sqlite-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: plugin-host/native/sqlite
        key: sqlite-${{ hashFiles('plugin-host/sqlite.pin') }}

    - name: Fetch the bundled SQLite
      # The SQLite amalgamation a plugin's databases use, never Android's own
      # (docs/plugin-api.md 5.3, "Preferences and SQLite are droidtop's"),
      # checked against plugin-host/sqlite.pin's size and SHA3-256.
      if: steps.sqlite-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-sqlite.sh

    - name: Cache the aria2 download engine
      id: aria2engine-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: net-core/aria2-engine
        key: aria2-engine-${{ hashFiles('net-core/aria2-engine.pin') }}

    - name: Fetch the aria2 download engine
      # aria2-engine-<version>.aar, built and released by
      # bi0shacker001/aria2-engine, checked against its SHA256SUMS and
      # net-core/aria2-engine.pin and laid out as the local Maven repository
      # settings.gradle.kts reads (docs/SPEC.md 12a, "One download engine").
      if: steps.aria2engine-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-aria2-engine.sh

    - name: Cache windowcast's Android library
      id: windowcast-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: app/windowcast-lib
        key: windowcast-lib-${{ hashFiles('app/windowcast.pin') }}

    - name: Fetch windowcast's Android library
      # windowcast-android-<version>.aar, attached to Droidtop/windowcast's release by its "Viewer release"
      # workflow, checked against its SHA256SUMS-android-library and app/windowcast.pin and laid out as the local
      # Maven repository settings.gradle.kts reads (docs/SPEC.md 7a).
      if: steps.windowcast-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash build-scripts/fetch-windowcast-lib.sh
