# droidtop's native library, libdroidtop_agent.so (docs/SPEC.md 7o): droidtop's own scaffold over the shared
# libraries (Droidtop/tracker#867, owner 2026-11-04: "each program to have its own scaffold, that can use as
# many shared libraries and stuff as possible"). It was droidtop-agent's crates/android, built and released by
# that repository; it moved here as it was, and build-scripts/build-agent-lib.sh builds it for both ABIs.
[package]
name = "droidtop-native"
description = "droidtop's side of the agent protocol: the shared core behind one JNI call, built as libdroidtop_agent.so for arm64-v8a and x86_64"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/droidtop"
rust-version = "1.89"
publish = false

[lib]
# The name droidtop loads (net-core AgentNative: System.loadLibrary("droidtop_agent")), unchanged.
name = "droidtop_agent"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Identity, pairing, the channel, the protocol and the sync rules: Droidtop/lib-sync.
droidtop-agent-core = { package = "sync-core", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.6" }
# The person's own shares (Droidtop/tracker#573): Droidtop/lib-net's share client, WebDAV and the backends to come.
# S3 as well as WebDAV (lib-net ci/remote-sftp-feature, on top of ci/remote-s3), pinned by that commit until lib-net
# releases it as v0.2.4; then that tag. Default features off, so no SFTP yet: russh 0.65 needs ed25519-dalek ^3, and the
# mesh test's droidtop-agent brings windowcast's sspi 0.21, which pins ed25519-dalek =3.0.0-rc.1; one graph can't hold
# both. SFTP turns on ("sftp") once windowcast takes sspi 0.22 or later.
net-remote = { git = "https://github.com/Droidtop/lib-net", rev = "43d9236f3605831669355caa755d197c87fe3bba", default-features = false }
# KDE Connect, both ways (Droidtop/tracker#645, SPEC 7q): kdeconnect_<op> is passed to
# lib-kdeconnect's operation table. At its commit on ci/notifications-out-645 until v0.1.1 is tagged.
kdeconnect-service = { git = "https://github.com/Droidtop/lib-kdeconnect", rev = "8fc97b36410ed682a3859d6a21953ba0412539ae" }
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The mesh test runs the real agent as one of its computers: droidtop-agent's service, at a release.
# droidtop-agent main fc52738 (Droidtop/tracker#867, #870, #573): the agent on lib-sync 0.1.6 and Rust 1.85, keying
# games by catalog id and title2:, with windowcast on IronRDP and sspi 0.23.1 (no patches needed any more).
# Becomes the agent release that carries it.
droidtop-agent-service = { git = "https://github.com/Droidtop/droidtop-agent", rev = "fc5273896cbd31cc00fb140b1db29b8b81f94bff" }
droidtop-agent-store = { package = "sync-store", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.6" }

[profile.release]
# As droidtop-agent built it.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
