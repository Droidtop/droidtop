org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Wasn't multithreaded at all before this -- 30+ independent library
# modules (IconLoader, Animation, Shared, msdl, flags, WMShared, the
# SettingsLib-* modules, runtime-*, shell-*, ...) were compiling one at a
# time despite plenty of idle cores available. org.gradle.caching also
# wasn't on, so even an unrelated one-line change re-did every module's
# work from scratch. configuration-cache is deliberately NOT enabled here
# yet -- shell-default's build.gradle does a lot of dynamic/programmatic
# configuration (cross-project framework-stub injection, JitPack stub
# resolution) that configuration-cache compatibility isn't guaranteed
# against; worth trying separately, not bundled into this change.
org.gradle.parallel=true
org.gradle.caching=true

# The Windows and Linux runtimes require NDK-built native components
# (Wine/Box64 from vendor/gamenative, DroidSpaces' C core, wlroots).
# Set this to a locally installed NDK before building :compositor,
# :runtime-windows, or :runtime-linux-root.
#android.ndkVersion=27.0.12077973
