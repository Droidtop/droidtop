# One memory budget for a GitHub-hosted runner. droidtop is a public
# repository, so its ubuntu-24.04 jobs run on the standard public-repo
# runner (4 vCPU, 16 GB RAM; android-build.yml prints `nproc` and
# `free -m` at the start of the build so the log shows what a run really
# got). This file used to budget against 7 GB, the size of a private-repo
# runner, and kept the heap at 4 GB.
#
# ApkFlinger packages inside the Gradle daemon, so what the packaging step
# has is this -Xmx. Packaging died with "OutOfMemoryError: Java heap
# space" in com.android.zipflinger.Compressor.deflate (Droidtop/tracker#283):
# on 2026-10-01 and 2026-10-02 in :app:packageRelease and :app:packageDebug
# (runs 36948734432, 36966530147, 37035552786), and once more on
# 2026-10-08 in :app:packageDebug (run 37808986646), after R8 had halved the
# release dex and the packaging tasks had been ordered one after the other.
# The debug APK is not shrunk (114 MB of dex), and by the time it is
# packaged the one daemon also holds everything the release pass left in
# its heap. 4 GB is what that last step could not fit.
# The daemon got 6 GB, and on 2026-10-16 :app:packageRelease died at that
# too (run 38922535914, zipflinger NoCopyByteArrayOutputStream): R8 had
# just run for three minutes inside the same daemon, and the debug
# variant's dexing and merging ran beside the packaging (org.gradle.parallel).
# The runner reported 15989 MB (free -m at the start of that run). The daemon
# now gets 8 GB. The Kotlin daemon keeps its 3 GB (below: less died with GC
# overhead), and by packaging time its compiles are over and SerialGC has
# handed most of that back. The realistic peak, 8 + 3 + 1 GB of metaspace
# plus aapt2, cmake and ninja, is about 13 GB, inside 16 GB with 3 GB of swap
# behind it (summed java RSS on the measured runs was 6.8 to 7.3 GB at 4 GB
# of heap).
# The Kotlin daemon: 2026-10-01 a change to library-core's API made
# :runtime-windows (which carries the vendored gamenative sources)
# recompile its debug and release variants side by side in the one Kotlin
# daemon, and that died three runs in a row with "GC overhead limit
# exceeded" in the JVM back end (run 36815488670). It gets 3 GB, and
# SerialGC with tight free-heap ratios hands what it no longer uses back
# to the OS after the compiles.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Wasn't multithreaded at all before this -- 30+ independent library
# modules (IconLoader, Animation, Shared, msdl, flags, WMShared, the
# SettingsLib-* modules, runtime-*, shell-*, ...) were compiling one at a
# time despite plenty of idle cores available. org.gradle.caching also
# wasn't on, so even an unrelated one-line change re-did every module's
# work from scratch. configuration-cache is deliberately NOT enabled here
# yet -- shell-default's build.gradle does a lot of dynamic/programmatic
# configuration (cross-project framework-stub injection, JitPack stub
# resolution) that configuration-cache compatibility isn't guaranteed
# against; worth trying separately, not bundled into this change.
org.gradle.parallel=true
org.gradle.caching=true

# The Windows and Linux runtimes require NDK-built native components
# (the Windows runtime's x86_64 libraries, DroidSpaces' C core, wlroots).
# Set this to a locally installed NDK before building :compositor,
# :runtime-windows, or :runtime-linux-root.
#android.ndkVersion=27.0.12077973
