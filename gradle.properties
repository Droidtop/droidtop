# One memory budget against a GitHub-hosted runner's 7 GB of RAM. The
# android-build run of 2026-09-25 died on the runner with an
# OutOfMemoryError in ApkFlinger, and the rerun of the same commit
# passed -- the signature of JVMs racing for one box, not of a build
# that deterministically needs more heap than it had. ApkFlinger
# packages inside the Gradle daemon, so what the packaging step has is
# this -Xmx; it stays at 4 GB (the initial scaffold's -Xmx4096m).
# Nothing bounded was everything beside that heap: metaspace is
# uncapped by default, and the Kotlin compile daemon KGP forks got no
# kotlin.daemon.jvmargs at all, so its heap was KGP's to pick -- a
# second JVM on the same runner, sized without reference to the first.
# MaxMetaspaceSize=1g gives AGP+KGP's classloaders a known ceiling
# (the old rule of thumb was 512m against a 2g heap; both doubled
# here), and a 2g Kotlin daemon covers the biggest single Kotlin
# compile in this tree, keeping both daemons' realistic peak -- 4 GB
# of packaging heap plus the pages the Kotlin daemon still holds from
# the compile passes -- inside 7 GB with room for the runner's OS, its
# agent and AGP's non-JVM workers (aapt2, cmake, ninja).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Wasn't multithreaded at all before this -- 30+ independent library
# modules (IconLoader, Animation, Shared, msdl, flags, WMShared, the
# SettingsLib-* modules, runtime-*, shell-*, ...) were compiling one at a
# time despite plenty of idle cores available. org.gradle.caching also
# wasn't on, so even an unrelated one-line change re-did every module's
# work from scratch. configuration-cache is deliberately NOT enabled here
# yet -- shell-default's build.gradle does a lot of dynamic/programmatic
# configuration (cross-project framework-stub injection, JitPack stub
# resolution) that configuration-cache compatibility isn't guaranteed
# against; worth trying separately, not bundled into this change.
org.gradle.parallel=true
org.gradle.caching=true

# The Windows and Linux runtimes require NDK-built native components
# (Wine/Box64 from vendor/gamenative, DroidSpaces' C core, wlroots).
# Set this to a locally installed NDK before building :compositor,
# :runtime-windows, or :runtime-linux-root.
#android.ndkVersion=27.0.12077973
