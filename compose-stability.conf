// Classes the Compose compiler may treat as stable (mytop-project/tracker#941), so a composable given one skips when the new
// value equals the old. Each is immutable all the way down: vals only, of immutable types (checked 2026-11-16). A class
// listed here must stay so; one that gains a var or a mutable collection leaves this file in the same change.
//
// LibraryEntry is what every game card, tile and capsule draws; the library is rebuilt as a new list of new entries
// on each change, so without this every card on screen re-ran on any library update.
dev.droidtop.library.LibraryEntry
dev.droidtop.library.PcInfo
dev.droidtop.library.GameLink
dev.droidtop.library.InstalledAppFacts
